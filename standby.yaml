## Patroni config for standby coordinator.
## Meant to be used inside the `greengage` container of docker-compose-greengage.yml,
## where this repository is mounted at /home/gpadmin/patroni.
##
## Prerequisites inside the container (as gpadmin):
##   source /usr/local/greengage-db-devel/greengage_path.sh
##   mdw is already running (see patroni.yaml)
##
## Run (second shell in the same container):
##   docker compose -f docker-compose-greengage.yml exec greengage bash
##   cd /home/gpadmin/patroni
##   python3 patroni.py standby.yaml
##
## data_dir is expected to be empty: node2 is created by pg_basebackup from node1.
## NOTE: it lives under the gpdemo datadirs, which `make create-demo-cluster` wipes --
## recreating the demo cluster also removes this node's data directory.

scope: test-cluster
namespace: /db/
name: smdw  # unique node name

restapi:
  # listen on all interfaces: the REST API is published to the host as 8009
  listen: 0.0.0.0:8009
  connect_address: greengage:8009

etcd3:
  # `etcd` service of docker-compose-greengage.yml
  host: etcd:2379

# Keep in sync with patroni.yaml, see the comment there.
greengage: {}

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true

postgresql:
  listen: 0.0.0.0:7001
  connect_address: greengage:7001
  data_dir: /home/gpadmin/gpdb_src/gpAux/gpdemo/datadirs/standby/
  # GPHOME of the unpacked bin_gpdb.tar.gz
  bin_dir: /usr/local/greengage-db-devel/bin
  # separate from node1's pgpass: both nodes share the container's /tmp
  pgpass: /tmp/pgpass1

  # Keep in sync with patroni.yaml -- whichever node is the leader serves the
  # replication connection, so both need the `replicator` entry.
  # Patroni rewrites pg_hba.conf from this list on every start and on SIGHUP;
  # bootstrap.pg_hba would never be applied here (node2 is cloned, not initdb'd).
  pg_hba:
    - local all all trust
    # gpstart/gpstop/gpstate and segment -> coordinator connections
    - host all gpadmin 0.0.0.0/0 trust
    - host all gpadmin ::1/128 trust
    # Patroni's own superuser and pg_rewind connections
    - host all patroni 0.0.0.0/0 md5
    - host all rewind_user 0.0.0.0/0 md5
    # Streaming replication over the container IP (host=greengage)
    - host replication replicator 0.0.0.0/0 md5
    - host replication gpadmin samehost trust
    - host all all 0.0.0.0/0 md5

  # A coordinator started by Patroni is in single node mode and accepts only
  # utility mode connections, hence `-c gp_role=utility` for every user.
  authentication:
    replication:
      username: replicator
      password: replicator_pass
      options: -c gp_role=utility
    superuser:
      username: patroni
      password: patroni_pass
      options: -c gp_role=utility
    rewind:
      username: rewind_user
      password: rewind_pass
      options: -c gp_role=utility

  # See the note in patroni.yaml: the dbid for pg_basebackup is assigned when
  # the node is registered as the coordinator standby on the leader.

  # See the note in patroni.yaml: GUCs Patroni manages itself live in DCS.
  parameters:
    unix_socket_directories: '/tmp'

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false

log:
  level: DEBUG
  traceback_level: DEBUG
