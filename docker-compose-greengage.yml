## Environment for the Patroni + Greengage PoC:
##   * etcd 3.7   -- DCS, reachable over the network at http://etcd:2379
##                   (and from the host at 127.0.0.1:2379)
##   * greengage  -- equivalent of
##       docker run --name greengage --rm -it \
##           --sysctl 'kernel.sem=500 1024000 200 4096' \
##           --add-host=host.docker.internal:host-gateway \
##           -v $PWD:/home/gpadmin/patroni \
##           ghcr.io/greengagedb/greengage/ggdb7_ubuntu:7.5.0 bash
##
## Usage:
##   docker compose -f docker-compose-greengage.yml up -d
##   docker compose -f docker-compose-greengage.yml exec greengage bash
##
## Inside the greengage container this repository is mounted at /home/gpadmin/patroni;
## patroni.yaml / standby.yaml then have to point at `etcd3: host: etcd:2379`.

name: patroni-greengage

services:
  etcd:
    image: quay.io/coreos/etcd:v3.7.2
    container_name: etcd
    hostname: etcd
    restart: unless-stopped
    environment:
      ETCD_UNSUPPORTED_ARCH: ''
      # no TLS and no authentication -- local development only
      ALLOW_NONE_AUTHENTICATION: 'yes'
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      # listen on all interfaces, so that both greengage and the host can reach it
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-token=patroni-poc
      - --initial-cluster-state=new
    ports:
      # expose etcd to the host as well (patroni.yaml: etcd3.host 127.0.0.1:2379)
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  greengage:
    image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu:7.5.0
    container_name: greengage
    hostname: greengage
    command: bash
    # equivalent of `-it` in docker run
    stdin_open: true
    tty: true
    # disposable container: remove it with `docker compose down`, like --rm
    restart: "no"
    working_dir: /home/gpadmin
    sysctls:
      kernel.sem: "500 1024000 200 4096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/home/gpadmin/patroni
    ports:
      # Patroni REST API and Greengage ports taken from patroni.yaml / standby.yaml
      - "8008:8008"
      - "8009:8009"
      - "7000:7000"
      - "7010:7010"
    depends_on:
      etcd:
        condition: service_healthy

volumes:
  etcd-data:
