## Patroni config for smdw, the standby coordinator of the gpdemo cluster.
## Meant to be used inside the `greengage` container of docker-compose-greengage.yml,
## where this repository is mounted at /home/gpadmin/patroni. See README.md in this
## directory for the complete setup.
##
## Run (as gpadmin, once mdw holds the leader lock):
##   python3 -m patroni ~/patroni/docker/greengage/smdw.yml
##
## smdw adopts the standby created by `make_cluster` (gpinitstandby). If its data_dir
## is empty, e.g. after `patronictl reinit`, it is pg_basebackup'd from the leader.
## NOTE: it lives under the gpdemo datadirs, which `make create-demo-cluster` wipes --
## recreating the demo cluster also removes this node's data directory.

scope: test-cluster
namespace: /db/
name: smdw  # unique node name

restapi:
  # listen on all interfaces: the REST API is published to the host as 8009
  listen: 0.0.0.0:8009
  connect_address: greengage:8009

etcd3:
  # `etcd` service of docker-compose-greengage.yml
  host: etcd:2379

# Keep in sync with mdw.yml, see the comment there.
greengage: {}

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      # Keep in sync with mdw.yml, see the comment there.
      parameters:
        max_connections: 150
        max_prepared_transactions: 250
        max_locks_per_transaction: 128
        max_worker_processes: 13

postgresql:
  listen: 0.0.0.0:7001
  connect_address: greengage:7001
  data_dir: /home/gpadmin/gpdb_src/gpAux/gpdemo/datadirs/standby/
  # GPHOME of the unpacked bin_gpdb.tar.gz
  bin_dir: /usr/local/greengage-db-devel/bin
  # separate from mdw's pgpass: both nodes share the container's /tmp
  pgpass: /tmp/pgpass1

  # Keep in sync with mdw.yml -- whichever node is the leader serves the
  # replication connection, so both need the `replicator` entry.
  # Patroni rewrites pg_hba.conf from this list on every start and on SIGHUP;
  # bootstrap.pg_hba would never be applied here (smdw is adopted or cloned, not initdb'd).
  pg_hba:
    - local all all trust
    # gpstart/gpstop/gpstate and segment -> coordinator connections
    - host all gpadmin 0.0.0.0/0 trust
    - host all gpadmin ::1/128 trust
    # Patroni's own superuser and pg_rewind connections
    - host all patroni 0.0.0.0/0 md5
    - host all rewind_user 0.0.0.0/0 md5
    # Streaming replication over the container IP (host=greengage)
    - host replication replicator 0.0.0.0/0 md5
    - host replication gpadmin samehost trust
    - host all all 0.0.0.0/0 md5

  # Patroni's connections to the coordinators must be utility mode ones (in dispatch
  # mode they fail on a freshly registered standby and pg_rewind silently breaks the
  # data directory), hence `-c gp_role=utility`. Patroni refuses to start without it
  # for the superuser and the rewind user, for the replication user it is harmless.
  authentication:
    replication:
      username: replicator
      password: replicator_pass
      options: -c gp_role=utility
    superuser:
      username: patroni
      password: patroni_pass
      options: -c gp_role=utility
    rewind:
      username: rewind_user
      password: rewind_pass
      options: -c gp_role=utility

  # See the note in mdw.yml: the dbid for pg_basebackup is assigned when
  # the node is registered as the coordinator standby on the leader.

  # See the note in mdw.yml: GUCs Patroni manages itself live in DCS, see bootstrap.dcs above.
  parameters:
    unix_socket_directories: '/tmp'

# Greengage supports only one coordinator standby, hence only mdw and smdw may be
# promoted. Any additional member of this Patroni cluster needs `nofailover: true`:
# Greengage wouldn't update gp_segment_configuration on its promotion.
tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false

# Patroni logs at INFO by default. For troubleshooting, e.g. to see the exact
# pg_basebackup command line or the DCS traffic, uncomment:
# log:
#   level: DEBUG
#   traceback_level: DEBUG
